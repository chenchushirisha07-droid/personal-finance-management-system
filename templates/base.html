<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fintrack{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom CSS (if you have additional styles) -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans flex flex-col min-h-screen">
    
    <!-- Navigation Bar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="/" class="text-2xl font-bold text-emerald-600">Fintrack</a>
                </div>
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="/" class="text-gray-600 hover:text-emerald-600 font-medium transition">Home</a>
                    <a href="/about" class="text-gray-600 hover:text-emerald-600 font-medium transition">About</a>
                    <a href="/services" class="text-gray-600 hover:text-emerald-600 font-medium transition">Features</a>
                    <a href="/contact" class="text-gray-600 hover:text-emerald-600 font-medium transition">Contact</a>
                    
                    <!-- Dynamic Login/Logout Logic -->
                    {% if user %}
                        <a href="/dashboard" class="text-gray-600 hover:text-emerald-600 font-medium transition">Dashboard</a>
                        <span class="bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full text-sm font-bold ml-4">{{ user }}</span>
                        <a href="/logout" class="text-red-500 font-medium hover:text-red-600 transition ml-4">Logout</a>
                    {% else %}
                        <a href="/login" class="text-gray-800 font-medium hover:text-emerald-600 transition ml-4">Login</a>
                        <a href="/login" class="bg-emerald-600 text-white px-5 py-2 rounded-full font-medium shadow hover:bg-emerald-700 transition ml-4">Get Started</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-8 text-center text-sm mt-auto">
        <p>&copy; 2026 Fintrack Personal Finance. All rights reserved.</p>
    </footer>

    <!-- Custom Scripts (if you have additional logic) -->
    <script src="/static/js/main.js"></script>
    
    <!-- Block for page-specific scripts -->
    {% block scripts %}{% endblock %}
</body>
</html>
