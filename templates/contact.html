{% extends "base.html" %}

{% block title %}Contact - Fintrack{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-10 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Get in Touch</h2>
        
        {% if success %}
        <div class="mb-6 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded text-center">
            Your message has been sent successfully!
        </div>
        {% endif %}

        <form action="/contact" method="POST" class="space-y-5">
            <div>
                <input type="text" name="fullName" placeholder="Full Name" required 
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition">
            </div>
            <div>
                <input type="email" name="emailAddress" placeholder="Email Address" required 
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition">
            </div>
            <div>
                <input type="text" name="subject" placeholder="Subject" required 
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition">
            </div>
            <div>
                <textarea name="message" placeholder="Message" rows="5" required 
                          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition resize-none"></textarea>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md mt-2">
                Submit
            </button>
        </form>
    </div>
</div>
{% endblock %}
